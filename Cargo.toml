[package]
name = "drawn"
version = "0.2.0"
edition = "2024"
description = "Lightweight SVG builder with batteries included"
license = "MIT"
repository = "https://github.com/Sheriff332/drawn"
readme = "README.md"
keywords = ["svg", "graphics", "vector", "canvas", "drawing"]
categories = ["graphics", "multimedia::images", "rendering"]
exclude = [
    "/*.png",
    "/*.svg",
    "/.idea/*"
]

[dependencies]
base64 = "0.23.1"
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = "0.3.23"